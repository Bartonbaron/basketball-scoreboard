<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div id="home-box">
            <h3>HOME</h3>
            <div class="score" id="home-score">0</div>
            <div class="btn-container">
                <button class="score-btn" onclick="incrementByOneHome()">+1</button>
                <button class="score-btn" onclick="incrementByTwoHome()">+2</button>
                <button class="score-btn" onclick="incrementByThreeHome()">+3</button>
            </div>
        </div>
        <div id="guest-box">
            <h3>GUEST</h3>
            <div class="score" id="guest-score">0</div>
            <div class="btn-container">
                <button class="score-btn" onclick="incrementByOneGuest()">+1</button>
                <button class="score-btn" onclick="incrementByTwoGuest()">+2</button>
                <button class="score-btn" onclick="incrementByThreeGuest()">+3</button>
            </div>
        </div>
    </div>
    <button id="new-game-btn" onclick="newGame()">New Game</button>
    <script src="index.js"></script>
</body>

</html>
